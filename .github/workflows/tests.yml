name: tests

# The project has no CI history and, until this workflow, had never been run
# on Linux at all -- every number in docs/RESULTS.md came off one Windows
# machine. So this runs the same checks on both, with the CPU torch wheel a
# newcomer actually installs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

# A new push to the same branch or PR makes the run in progress pointless;
# cancel it rather than queue a second full matrix behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Windows consoles are cp1252 and cannot encode Devanagari; the test suite
  # and several scripts print it. docs/DEVELOPING.md "Gotchas" has this one.
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  lint:
    # Its own job, so a style finding does not hide (or wait on) a test
    # result. The rules live in pyproject.toml's [tool.ruff].
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: ruff
        run: |
          pip install ruff
          ruff check .

  tests:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
        include:
          # One newer interpreter, to catch a deprecation before a user does.
          - os: ubuntu-latest
            python: '3.13'
          # And the oldest one pyproject.toml promises (requires-python).
          - os: ubuntu-latest
            python: '3.10'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (CPU wheel, as the tutorial tells people to)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          # Not dependencies of the model, training or serving, but of paths
          # the tests cover: the transformers export, the HF tokenizer, the
          # Gradio demos and the OpenAI-compatible API (gradio brings fastapi
          # and uvicorn). Each of those tests skips itself without them, and a
          # skip that reports PASS is how an untested path looks tested.
          pip install transformers tokenizers gradio python-multipart
          # The package itself, so `python -m anulm` works from any directory
          # (tests.test_release_fixes checks it from outside the checkout).
          # --no-deps: torch is already the CPU wheel and must stay that one.
          pip install --no-deps -e .

      # Left on each runner's default shell (PowerShell on Windows, bash on
      # Linux) on purpose: these are the commands a newcomer types, and they
      # should work in whatever shell they already have open.
      #
      # -u everywhere. CI's stdout is a pipe, so python block-buffers it, and
      # a process that dies without flushing takes its whole log with it: a
      # Windows job once failed here after 17 seconds having printed nothing
      # at all, which said only that something crashed, not what. This is the
      # same buffering gotcha docs/DEVELOPING.md warns about for piped runs.
      - name: Report the environment
        run: python -u -m anulm quickstart

      - name: Shapes, forward and backward, no data
        run: python -u -m anulm model

      # One command per step. A multi-line `run:` under PowerShell exits with
      # the LAST command's code only, so a failing suite followed by a passing
      # one turned the Windows job green.
      - name: Test suite (core, its own runner and summary line)
        run: python -u -m tests.test_model

      - name: Test suite (pipeline, multimodal, release fixes)
        run: python -u -m unittest tests.test_training_pipeline tests.test_multimodal_contracts tests.test_release_fixes

      # Picked up by pattern, so a new tests/test_quality_*.py runs without an
      # edit here. Not `discover -p "test_*.py"`: that would also collect
      # test_model.py's generated TestCase and run the core suite twice.
      - name: Test suite (code-quality regressions)
        run: python -u -m unittest discover -s tests -t . -p "test_quality_*.py"

      # tinyshakespeare is fetched from GitHub on first use; keep it between
      # runs so the training step and the smoke run do not depend on the
      # network every time. The file never changes, hence the fixed key.
      - name: Cache tinyshakespeare
        uses: actions/cache@v4
        with:
          path: data/input.txt
          key: tinyshakespeare-v1

      - name: Train 50 steps end to end
        # Downloads tinyshakespeare, trains, evaluates, saves, and samples from
        # the result: the whole pipeline a newcomer meets first, in ~2 minutes
        # of CPU. Catches breakage that unit tests cannot -- a bad data path,
        # a checkpoint that will not reload, a sampler that hangs.
        run: |
          python -u -m anulm train --preset tiny-gqa --steps 50 --eval-every 25 --out ckpt_ci.pt
          python -u -m anulm sample --ckpt ckpt_ci.pt --prompt "KING RICHARD II:" --tokens 40

      - name: Reload the checkpoint, and load every shipped tokenizer
        shell: bash          # one shell for the heredocs, on both runners
        run: |
          python - <<'PY'
          from anulm.model import load_checkpoint, AnuLM
          ck = load_checkpoint('ckpt_ci.pt')
          m = AnuLM(ck['cfg']).eval()
          m.load_state_dict(ck['model'])
          total, active = m.num_params()
          print('reloaded step', ck['step'], '->', f'{total:,} params, {active:,} active')
          PY
          python - <<'PY'
          # The project was renamed in 2026 and the tokenizer format id with it.
          # The files beside the released weights still carry the old id, so
          # both must keep loading -- test_model.py pins this, and here it runs
          # against the tokenizers actually shipped in the repository.
          import glob
          from anulm.bpe import BPE
          for f in sorted(glob.glob('data/*.json')):
              print(f, '->', len(BPE.load(f).merges), 'merges')
          PY

      - name: Every main command end to end (tools.smoke)
        # Train, sample, fine-tune, ask, score, export, reload without the
        # repository, serve over HTTP -- each as its own process. About a
        # minute; Linux only, since the Windows job already covers training
        # and sampling above and the smoke run adds a local HTTP server.
        if: runner.os == 'Linux'
        run: python -u -m tools.smoke
