# Publish the landing page (site/) to GitHub Pages.
# tools/build_site.py leaves out the enquiry form and the privacy notice until both
# are ready (docs/LAUNCH.md), and tools/check_site.py must pass on what ships.
name: pages

on:
  push:
    branches: [restructure]
    paths: ["site/**", "tools/build_site.py", "tools/check_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the deploy folder
        run: python tools/build_site.py --out _site
      - name: Check what ships
        run: python tools/check_site.py --dir _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
