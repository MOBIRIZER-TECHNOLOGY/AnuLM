<title id="t">Figure 34.1 · The DPO loss against the margin</title>
<desc id="d">The loss minus log sigmoid of the margin falls from about 3 at margin minus 3 to near 0 at margin 5; it is ln 2 at margin 0 and 0.598 at margin 0.2.</desc>
