<title id="t">Figure 15.2 · The residual stream of the released model</title>
<desc id="d">The stream&#x27;s RMS per token grows from 0.023 entering layer 0 to 4.381 entering the final norm. What attention and the feed-forward half add grows with it, from under 0.4 in the early layers to between 1.0 and 1.8 in layers 18 and 19.</desc>
