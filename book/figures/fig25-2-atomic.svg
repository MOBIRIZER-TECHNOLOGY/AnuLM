<text x="95.0" y="247.0" class="f-muted" fill="#5E6E72" font-size="10.5" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">old, complete</text>
<line x1="170.0" y1="233.0" x2="208.0" y2="233.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210.0" y="210.0" width="190.0" height="46.0" rx="6" fill="#F0F2F1" class="f-card" stroke="#DCE1DF" stroke-width="1.2"></rect>
<text x="305.0" y="230.0" class="f-ink" fill="#17262E" font-size="12.5" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">ckpt.pt.last.tmp</text>
<text x="305.0" y="247.0" class="f-muted" fill="#5E6E72" font-size="10.5" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">torch.save writes here</text>
<line x1="400.0" y1="233.0" x2="438.0" y2="233.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440.0" y="210.0" width="130.0" height="46.0" rx="6" fill="#F0F2F1" class="f-card" stroke="#C4532F" stroke-width="1.2"></rect>
<text x="505.0" y="230.0" class="f-ink" fill="#17262E" font-size="12.5" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">half written</text>
<text x="505.0" y="247.0" class="f-muted" fill="#5E6E72" font-size="10.5" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">kill arrives</text>
<line x1="570.0" y1="233.0" x2="598.0" y2="233.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="600.0" y="210.0" width="140.0" height="46.0" rx="6" fill="#F0F2F1" class="f-card" stroke="#0E9488" stroke-width="1.2"></rect>
<text x="670.0" y="230.0" class="f-ink" fill="#17262E" font-size="12.5" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">ckpt.pt.last</text>
<text x="670.0" y="247.0" class="f-muted" fill="#5E6E72" font-size="10.5" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">old, still complete</text>
<text x="210.0" y="280.0" class="f-muted" fill="#5E6E72" font-size="11.5" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">without the kill: os.replace(tmp, path) swaps the finished file in, in one step</text>
<text x="210.0" y="298.0" class="f-muted" fill="#5E6E72" font-size="11.5" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">(atomic within a volume, as the code&#x27;s comment says)</text>
