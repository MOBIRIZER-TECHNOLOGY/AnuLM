<title id="t">Figure 20.1 · The whole model</title>
<desc id="d">Token ids become a (B, S, D) residual stream through the embedding table. Layer 0 adds attention and a dense SwiGLU; layers 1 to 19 add attention and a mixture of experts whose router picks 4 of 24. A final RMSNorm and lm_head produce (B, S, V) logits for the loss or for sampling.</desc>
