<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 13.2 · Do heads that share keys attend alike?</title>
<desc id="d">For each of 20 layers, the mean total-variation distance between attention rows of query heads that share a key/value head, and of heads that do not. Same-group pairs are closer in 19 layers; layer 0 most of all, 0.038 against 0.238. Over all layers 0.494 against 0.570.</desc>
