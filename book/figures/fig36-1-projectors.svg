<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 36.1 · From pixels and samples to positions</title>
<desc id="d">Audio: 16 kHz samples go through the frozen Whisper-small encoder to 501 frames of 768, are stacked four at a time to 125 vectors of 3,072, and projected to 125 positions of 1,024. Image: 224 by 224 pixels go through the frozen SigLIP tower to 196 patches of 768, are pooled 2 by 2 to 49 vectors of 3,072, and projected to 49 positions.</desc>
