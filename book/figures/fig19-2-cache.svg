<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 19.2 · What each design caches</title>
<desc id="d">tiny_mla&#x27;s MLA caches 72 numbers against 720 for full per-head K and V, 10 times fewer; tiny_gqa&#x27;s GQA caches 256 against 768; the released GQA model caches 512 against 2,048.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#DCE1DF" class="f-rule" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E6E72" class="f-muted-fill"/></marker></defs>
<text x="20.0" y="28.0" class="f-ink" fill="#17262E" font-size="15" font-family="Lora, Georgia, serif" font-weight="700" text-anchor="start">Numbers cached per token per layer</text>
<text x="20.0" y="48.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">what each design caches, against full per-head keys and values · log scale · verified</text>
<circle cx="234" cy="70" r="5" fill="#0E9488" class="f-teal"/>
<text x="244.0" y="74.0" class="f-ink" fill="#17262E" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">cached</text>
<circle cx="324" cy="70" r="5" fill="#C4532F" class="f-coral"/>
<text x="334.0" y="74.0" class="f-ink" fill="#17262E" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">if every head kept its own K and V</text>
<line x1="324.6" y1="90.0" x2="324.6" y2="250.0" stroke="#DCE1DF" class="f-rule" stroke-width="1"/>
<text x="324.6" y="266.0" class="f-muted" fill="#5E6E72" font-size="10" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">10</text>
<line x1="419.2" y1="90.0" x2="419.2" y2="250.0" stroke="#DCE1DF" class="f-rule" stroke-width="1"/>
<text x="419.2" y="266.0" class="f-muted" fill="#5E6E72" font-size="10" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">100</text>
<line x1="513.9" y1="90.0" x2="513.9" y2="250.0" stroke="#DCE1DF" class="f-rule" stroke-width="1"/>
