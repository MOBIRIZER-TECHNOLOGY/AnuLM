<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 19.2 · What each design caches</title>
<desc id="d">nano_105b&#x27;s MLA caches 72 numbers against 720 for full per-head K and V; the released GQA model caches 512 against 2,048; Sarvam 30B&#x27;s GQA 512 against 8,192; Sarvam 105B&#x27;s configured MLA caches 576 against 20,480, 35.6 times fewer, but more than the 30B&#x27;s GQA.</desc>
