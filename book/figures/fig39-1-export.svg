<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 39.1 · From a training checkpoint to two loaders</title>
<desc id="d">A pickled fp32 checkpoint goes through export_hf.main into a folder of seven kinds of file: model.safetensors (796.5 MB, bf16 and fp32), config.json, the tokenizer, a README, and three code files. load_checkpoint reads the folder into the native model; AutoModelForCausalLM reads it through the copied wrapper with trust_remote_code.</desc>
