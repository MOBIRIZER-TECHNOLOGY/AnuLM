<text x="707.0" y="162.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">(B, S, 1536)</text>
<line x1="110.0" y1="140.0" x2="158.0" y2="104.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>
