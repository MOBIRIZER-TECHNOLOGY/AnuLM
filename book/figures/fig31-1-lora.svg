<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 31.1 · LoRA beside a frozen weight</title>
<desc id="d">x goes through the frozen W and, in parallel, through A (16 by 1024) and B (1536 by 16) scaled by alpha over r; the two are added. Merging replaces W with W plus (alpha/r) B A.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#DCE1DF" class="f-rule" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E6E72" class="f-muted-fill"/></marker></defs>
<text x="20.0" y="28.0" class="f-ink" fill="#17262E" font-size="15" font-family="Lora, Georgia, serif" font-weight="700" text-anchor="start">LoRA beside a frozen weight, then merged</text>
<text x="20.0" y="48.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">query_key_value of the released model, r = 16, α = 32 · shapes per token</text>
<rect x="20.0" y="120.0" width="90.0" height="56.0" rx="8" fill="#F0F2F1" class="f-card" stroke="#DCE1DF" stroke-width="1"></rect>
<text x="65.0" y="145.0" class="f-ink" fill="#17262E" font-size="13" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">x</text>
<text x="65.0" y="162.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">(B, S, 1024)</text>
<rect x="160.0" y="74.0" width="230.0" height="56.0" rx="8" fill="#F0F2F1" class="f-card" stroke="#DCE1DF" stroke-width="1"></rect>
<text x="275.0" y="99.0" class="f-ink" fill="#17262E" font-size="13" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">W  frozen</text>
<text x="275.0" y="116.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">1536 × 1024 = 1,572,864</text>
<rect x="160.0" y="166.0" width="120.0" height="56.0" rx="8" fill="#F0F2F1" class="f-card" stroke="#7B5E8E" stroke-width="2.5"></rect>
<text x="220.0" y="191.0" class="f-ink" fill="#17262E" font-size="13" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">A  trains</text>
<text x="220.0" y="208.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">16 × 1024</text>
<rect x="318.0" y="166.0" width="160.0" height="56.0" rx="8" fill="#F0F2F1" class="f-card" stroke="#7B5E8E" stroke-width="2.5"></rect>
<text x="398.0" y="191.0" class="f-ink" fill="#17262E" font-size="13" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">B  trains, 0 at start</text>
<text x="398.0" y="208.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">1536 × 16</text>
<rect x="500.0" y="166.0" width="64.0" height="56.0" rx="8" fill="#F0F2F1" class="f-card" stroke="#7B5E8E" stroke-width="2.5"></rect>
