<line x1="478.0" y1="194.0" x2="498.0" y2="194.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="564.0" y1="186.0" x2="600.0" y2="160.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390.0" y1="102.0" x2="596.0" y2="142.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="628.0" y1="148.0" x2="662.0" y2="148.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="160.0" y="250.0" class="f-ink" fill="#17262E" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="start">trainable: r·(in + out) = 16·(1024 + 1536) = 40,960, 2.6% of W</text>
<line x1="20.0" y1="270.0" x2="740.0" y2="270.0" stroke="#DCE1DF" class="f-rule" stroke-width="1"/>
<text x="20.0" y="296.0" class="f-ink" fill="#17262E" font-size="13" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" text-anchor="start">merge_lora:  W ← W + (α/r)·B A</text>
<text x="20.0" y="316.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">one matrix again, the same shape as W: no extra work per token after merging</text>
</svg>
