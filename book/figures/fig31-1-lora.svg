<text x="532.0" y="208.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">= 2</text>
<circle cx="612" cy="148" r="16" fill="#F0F2F1" class="f-card" stroke="#5E6E72" stroke-width="1.5"/>
