<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 1.3 · The whole model at a glance</title>
<desc id="d">Token ids (B, S) become vectors through the embedding table (Chapter 10). 20 layers each branch off the residual stream twice: RMSNorm then attention (Chapters 11 to 14), RMSNorm then a mixture-of-experts feed-forward network whose router picks 4 of 24 experts (Chapters 16 to 18), each result added back to the stream (Chapter 15). Layer 0 uses a dense SwiGLU instead. A final RMSNorm and the output head give (B, S, V) logits; softmax and a pick give the next token (Chapters 3, 5 and 28).</desc>
