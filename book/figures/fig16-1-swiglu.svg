<title id="t">Figure 16.1 · The SwiGLU, one token</title>
<desc id="d">The normalised token u is projected twice from D to I. One projection passes through SiLU to become the gates; the gates multiply the other projection element by element, and down_proj maps the product back to width D.</desc>
