<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 8.1 · One Devanagari letter as three bytes</title>
<desc id="d">The 16 bits of U+092D, 0000 100100 101101, go into three bytes: 1110 0000, 10 100100, 10 101101, which are 0xe0 0xa4 0xad. The marker bits 1110, 10 and 10 are highlighted.</desc>
