<title id="t">Figure 23.2 · Memory per training step</title>
<desc id="d">Peak allocated memory: plain 12.26 GiB, gradient checkpointing 6.64, chunked loss 11.34, both 6.18. Of each, 4.44 GiB is the weights and AdamW moments, resident between steps; the rest is gradients, activations, logits and workspace. The plain run&#x27;s allocator reserves 15.12 GiB, past the 14.65 GiB warning line and below the 15.92 GiB card.</desc>
