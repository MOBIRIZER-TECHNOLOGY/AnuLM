<title id="t">Figure 39.2 · What the released file stores</title>
<desc id="d">Groups of tensors on a log scale of numbers: expert matrices 268,959,744, vocabulary tables 67,108,864, attention 52,428,800 and layer-0 SwiGLU 8,650,752 in bfloat16; router weights 466,944, norm gains 44,544 and router bias and load counts 912 in float32. Held-out loss 3.37908 native, 3.37903 exported, 3.38219 with router biases rounded, 3.38572 with them zeroed, 3.37905 centred then rounded, 3.38285 for the whole model in bfloat16.</desc>
