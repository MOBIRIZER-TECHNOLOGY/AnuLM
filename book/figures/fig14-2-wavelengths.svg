<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 14.2 · How fast each pair turns</title>
<desc id="d">Both bases start at 6.28 tokens per turn for pair 0. At θ = 10,000 the slowest pair turns once in 47,117 tokens and 18 pairs complete a turn within 1,024 tokens; at θ = 1,000,000 the slowest takes 4,080,185 tokens and 12 pairs complete a turn.</desc>
