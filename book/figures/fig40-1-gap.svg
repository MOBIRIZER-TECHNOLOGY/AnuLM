<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 40.1 · The repository against a serving stack</title>
<desc id="d">Seven rows. Requests: one lock against continuous batching. KV cache: a dict per layer grown by concatenation against paged blocks. Weights: fp32 with bf16 autocast against int8 or int4. Decoding: one token per forward against speculative decoding. Attention: PyTorch SDPA against own kernels. Training: one GPU against data, tensor and pipeline parallelism with ZeRO. Operations: an optional key against rate limits, metrics and filters.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#DCE1DF" class="f-rule" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E6E72" class="f-muted-fill"/></marker></defs>
<text x="20.0" y="28.0" class="f-ink" fill="#17262E" font-size="15" font-family="Lora, Georgia, serif" font-weight="700" text-anchor="start">The repository against a serving stack</text>
<text x="20.0" y="48.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">solid: at @2e80b3e · dashed: EXTENSION, not in the repository</text>
