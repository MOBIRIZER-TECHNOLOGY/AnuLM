<title id="t">Figure 22.1 · The training loop</title>
<desc id="d">Setup runs once: arguments, precision, data and sampler, model, compile probe, optimizer and resume. Each step sets the learning rate, zeroes the gradients, accumulates M micro-batches, clips, steps the optimizer, updates the expert biases, logs, and every --eval-every steps evaluates and saves.</desc>
