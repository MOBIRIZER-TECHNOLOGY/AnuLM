<text x="20.0" y="172.0" class="f-ink" fill="#17262E" font-size="12" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="start">hidden states (1, 52, D)  →  gather at [42, 47, 51]  →  (1, 3, D)</text>
<text x="20.0" y="192.0" class="f-ink" fill="#17262E" font-size="12" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="start">→  Linear(D, 1)  →  (1, 3) logits  →  softmax(logits / τ)</text>
<text x="20.0" y="222.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">Each marked position has read the message and its own option&#x27;s name; under causal attention it has</text>
<text x="20.0" y="240.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">not read the options after it. One pass serves all K options.</text>
