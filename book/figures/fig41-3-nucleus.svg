<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 41.3 · Nucleus sizes on the released model</title>
<desc id="d">Paired histograms of how many tokens top-p keeps at each of 4,092 held-out positions. At p = 0.5 most positions keep 1 to 4 tokens, median 3. At p = 0.9 the spread runs from 1 token (13.1% of positions) to over 16,000, median 501; 64.4% of positions keep more than the 50 tokens sample.py&#x27;s top-k allows.</desc>
