<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 21.1 · From documents to a batch</title>
<desc id="d">build_v2.py encodes each document, appends EOS, and sends it to train.u16 or val.u16 by a hash of its first 200 characters. train.py memory-maps the files, draws B window starts without replacement, and make_batch cuts (B, S) inputs and targets shifted by one.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#DCE1DF" class="f-rule" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E6E72" class="f-muted-fill"/></marker></defs>
<text x="20.0" y="28.0" class="f-ink" fill="#17262E" font-size="15" font-family="Lora, Georgia, serif" font-weight="700" text-anchor="start">From documents to a batch</text>
<text x="20.0" y="48.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">experiments/build_v2.py runs once; train.py reads its files for every step</text>
<rect x="20.0" y="78.0" width="150.0" height="62.0" rx="8" fill="#F0F2F1" class="f-card" stroke="#DCE1DF" stroke-width="1"></rect>
<text x="95.0" y="98.0" class="f-ink" fill="#17262E" font-size="12.5" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">documents</text>
<text x="95.0" y="115.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">4 sources</text>
<text x="95.0" y="129.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">in a fixed order</text>
<rect x="210.0" y="70.0" width="200.0" height="78.0" rx="8" fill="#F0F2F1" class="f-card" stroke="#0E9488" stroke-width="2.5"></rect>
<text x="310.0" y="90.0" class="f-ink" fill="#17262E" font-size="12.5" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">build_v2.py</text>
<text x="310.0" y="107.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">encode, append EOS</text>
<text x="310.0" y="121.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">crc32(first 200 chars)</text>
<text x="310.0" y="135.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">lowest 1% → val</text>
