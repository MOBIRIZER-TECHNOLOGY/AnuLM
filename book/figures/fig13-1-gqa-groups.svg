<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 13.1 · Heads as slices of one projection</title>
<desc id="d">The fused projection&#x27;s 1,536 outputs are 24 slices of 64: query heads q0–q15, key heads k0–k3 and value heads v0–v3. repeat_interleave lets query heads 4g to 4g+3 read key/value head g.</desc>
