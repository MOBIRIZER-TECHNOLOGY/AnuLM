<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 1.1 · The four-step loop</title>
<desc id="d">Read: the model runs on ids (1, 4) and returns logits (1, 1, 64). Score: softmax gives probabilities (1, 64). Pick: one id (1, 1). Repeat: the id is appended and the loop runs again.</desc>
