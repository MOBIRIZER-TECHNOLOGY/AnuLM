<title id="t">Figure 6.1 · Backpropagation through SwiGLU</title>
<desc id="d">x (N, D) feeds a = x Wg^T and b = x Wu^T (N, I); s = silu(a); h = s times b; y = h Wd^T (N, D). Gradients flow back along each edge; the two reaching x add.</desc>
