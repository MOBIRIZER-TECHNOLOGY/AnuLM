<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 11.4 · Why divide by √d</title>
<desc id="d">Unscaled, the keys in play fall from 131.7 at d = 2 to 27.8 at d = 8 and 2.5 at d = 64. Divided by √d they stay near 160 at every width: 172.2, 161.8, 157.0.</desc>
