<title id="t">Figure 26.2 · bf16 routing, measured on the released model</title>
<desc id="d">For each of the 19 MoE layers, the share of tokens whose four chosen experts change when the gate runs under bf16 autocast. Layer 1 changes 10.95%, the deepest layer 1.69%; over all layers 3.17% of expert sets change.</desc>
