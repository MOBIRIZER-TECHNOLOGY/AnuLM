<title id="t">Figure 11.1 · Scaled dot-product attention, one head</title>
<desc id="d">x is projected to Q, K and V. Q times K-transpose gives an S by T score matrix, which is divided by the square root of d, masked, and turned into weights by a row-wise softmax; the weights average V into an S by d output.</desc>
