<title id="t">Figure 15.1 · Pre-norm and post-norm</title>
<desc id="d">Left, as in model.py: each sublayer reads a normalised copy of the stream and its output is added back; the stream is never normalised. Right, drawn dashed because it is not in the repository: the sublayer&#x27;s output is added and the sum is normalised.</desc>
