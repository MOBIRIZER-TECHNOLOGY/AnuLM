<title id="t">Figure 21.2 · Three ways to hold data out</title>
<desc id="d">The base-v2 training file is 53.0% English, 40.4% Hindi and 6.6% Python. Its last 10% would be 65.9% Python, 34.1% Hindi and no English. The hash split the build used holds out 53.0% English, 40.9% Hindi and 6.1% Python.</desc>
