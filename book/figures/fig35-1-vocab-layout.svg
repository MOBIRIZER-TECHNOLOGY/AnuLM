<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 35.1 · The grown vocabulary</title>
<desc id="d">A bar from 0 to 61,445. Text ids fill 0 to 32,767. Seven audio blocks of 4,096 ids each, one per SNAC slot, fill 32,768 to 61,439. Five control tokens follow: &lt;|speech|&gt; 61,440, &lt;|/speech|&gt; 61,441, &lt;|text|&gt; 61,442, &lt;|image|&gt; 61,443, &lt;|/image|&gt; 61,444.</desc>
