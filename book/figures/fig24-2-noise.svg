<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 24.2 · How much a val loss moves with its windows</title>
<desc id="d">Ten random sets of 80 windows give val losses from 3.2508 to 3.4436, each with about ± 0.067. Three random sets of 400 windows give 3.353 to 3.391 with about ± 0.029. The recorded strided set gives 3.3523 ± 0.0491, and a per-source stratified estimate 3.3680 ± 0.0169.</desc>
