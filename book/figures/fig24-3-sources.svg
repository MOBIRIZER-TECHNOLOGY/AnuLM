<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 24.3 · Loss per token and per byte, by source</title>
<desc id="d">Per token, Hindi web (3.231) scores better than English (3.605) and Python is lowest (2.173). Per byte the order changes: Hindi web 0.497, Python 0.776, Hindi Wikipedia 0.619, English 1.175, because a Hindi token covers about twice the bytes of an English one. The whole split reads 3.352 nats per token, 0.756 bits per byte.</desc>
