<title id="t">Figure 4.2 · The batched matrix multiply</title>
<desc id="d">q (2, 4, 5, 8) times k transposed (2, 4, 8, 5) gives scores (2, 4, 5, 5): the batch and head axes pass through and the head width is summed over.</desc>
