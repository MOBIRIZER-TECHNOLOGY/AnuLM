<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 41.1 · The four checkpoints</title>
<desc id="d">Four cards in a row. Train: loss 5.62 at step 0 against ln 259 = 5.56, val 1.52 ± 0.03 after 1,000 steps. Trace: (2, 5) ids become a (2, 5, 32) stream and (2, 1, 64) logits. Extend, dashed as an extension: top-p passes three tests, the off-by-one version fails all three and the unnormalised one fails one. Test: 66 passed, then the released 397.7M model.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#DCE1DF" class="f-rule" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E6E72" class="f-muted-fill"/></marker></defs>
<text x="20.0" y="28.0" class="f-ink" fill="#17262E" font-size="15" font-family="Lora, Georgia, serif" font-weight="700" text-anchor="start">The capstone in four checkpoints</text>
<text x="20.0" y="48.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">each one prints a number you can compare against the book&#x27;s</text>
