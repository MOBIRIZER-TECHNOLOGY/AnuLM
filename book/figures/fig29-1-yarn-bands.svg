<title id="t">Figure 29.1 · Which pairs YaRN stretches</title>
<desc id="d">Pairs 0 to 3 keep their frequency, pairs 12 to 31 are divided by the factor (2 or 4), and pairs 4 to 11 ramp between; at factor 2 pair 4 is divided by 1.06, at factor 4 by 1.09.</desc>
