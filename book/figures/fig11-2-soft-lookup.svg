<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 11.2 · One attention row by hand</title>
<desc id="d">The query of &#x27;bit&#x27; is scored against the keys of The, dog and bit; the scores are divided by √2, turned into weights 0.074, 0.620 and 0.306 by the softmax, and used to average the values.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#DCE1DF" class="f-rule" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E6E72" class="f-muted-fill"/></marker></defs>
<text x="20.0" y="28.0" class="f-ink" fill="#17262E" font-size="15" font-family="Lora, Georgia, serif" font-weight="700" text-anchor="start">One query, three keys: the bit row of the toy, step by step</text>
<rect x="20.0" y="128.0" width="120.0" height="74.0" rx="6" fill="#F0F2F1" class="f-card"></rect>
<text x="80.0" y="152.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="middle">query of bit</text>
<text x="80.0" y="180.0" class="f-ink" fill="#17262E" font-size="15" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" text-anchor="middle">q = [1, 2]</text>
<text x="214.0" y="64.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="start" letter-spacing="0.6">key k</text>
<text x="330.0" y="64.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.6">q·k</text>
<text x="408.0" y="64.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.6">÷ √2</text>
<text x="478.0" y="64.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="start" letter-spacing="0.6">softmax weight</text>
<text x="640.0" y="64.0" class="f-muted" fill="#5E6E72" font-size="11" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="start" letter-spacing="0.6">value v</text>
<line x1="170.0" y1="74.0" x2="740.0" y2="74.0" stroke="#DCE1DF" class="f-rule" stroke-width="1"/>
<line x1="140.0" y1="165.0" x2="206.0" y2="112.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="214.0" y="106.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="start">The</text>
<text x="214.0" y="126.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="start">[1, 0]</text>
<text x="330.0" y="126.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">1</text>
<text x="408.0" y="126.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">0.707</text>
<rect x="478.0" y="113.0" width="130.0" height="18.0" rx="4" fill="#F0F2F1" class="f-card"></rect>
<rect x="478.0" y="113.0" width="9.7" height="18.0" rx="4" fill="#D9A13B" class="f-gold"><title>The: weight 0.074</title></rect>
<text x="493.7" y="126.0" class="f-ink" fill="#17262E" font-size="12" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" text-anchor="start">0.074</text>
<text x="640.0" y="126.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="start">[0, 1]</text>
<line x1="140.0" y1="165.0" x2="206.0" y2="186.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="214.0" y="180.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="start">dog</text>
<text x="214.0" y="200.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="start">[0, 2]</text>
<text x="330.0" y="200.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">4</text>
<text x="408.0" y="200.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">2.828</text>
<rect x="478.0" y="187.0" width="130.0" height="18.0" rx="4" fill="#F0F2F1" class="f-card"></rect>
<rect x="478.0" y="187.0" width="80.6" height="18.0" rx="4" fill="#D9A13B" class="f-gold"><title>dog: weight 0.620</title></rect>
<text x="564.6" y="200.0" class="f-ink" fill="#17262E" font-size="12" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" text-anchor="start">0.620</text>
<text x="640.0" y="200.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="start">[2, 0]</text>
<line x1="140.0" y1="165.0" x2="206.0" y2="260.0" stroke="#5E6E72" class="f-muted-stroke" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="214.0" y="254.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="start">bit</text>
<text x="214.0" y="274.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="start">[1, 1]</text>
<text x="330.0" y="274.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">3</text>
<text x="408.0" y="274.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="middle">2.121</text>
<rect x="478.0" y="261.0" width="130.0" height="18.0" rx="4" fill="#F0F2F1" class="f-card"></rect>
<rect x="478.0" y="261.0" width="39.7" height="18.0" rx="4" fill="#D9A13B" class="f-gold"><title>bit: weight 0.306</title></rect>
<text x="523.7" y="274.0" class="f-ink" fill="#17262E" font-size="12" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" text-anchor="start">0.306</text>
<text x="640.0" y="274.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="start">[1, 1]</text>
<line x1="740.0" y1="74.0" x2="740.0" y2="74.0" stroke="#DCE1DF" class="f-rule" stroke-width="1"/>
<text x="20.0" y="316.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="start">output = Σ weight × value</text>
<text x="20.0" y="340.0" class="f-ink" fill="#17262E" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="400" text-anchor="start">0.074·[0, 1] + 0.620·[2, 0] + 0.306·[1, 1] = [1.546, 0.380]</text>
<text x="20.0" y="366.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">bit&#x27;s query is long in the second component; dog&#x27;s key is too, so dog wins 62% of the weight.</text>
</svg>
