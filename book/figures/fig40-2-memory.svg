<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 40.2 · A 16 GiB card for the released model</title>
<desc id="d">As served, the fp32 weights plus the grouped path&#x27;s bf16 expert stack take 1.98 GiB; hypothetical bf16, int8 and int4 weights 0.74, 0.37 and 0.20 GiB. A 1,024-token cache takes 30 MiB as served, 20 MiB in bf16; one layer&#x27;s fp32 scores 64 MiB; AdamW&#x27;s training state 5.93 GiB.</desc>
