<title id="t">Figure 33.1 · Retrieve, then read</title>
<desc id="d">A question goes to BM25, to a borrowed dense retriever, or to both fused by reciprocal rank; the top three passages go to a generative reader or to a pointer reader that scores answer spans.</desc>
