<text x="20.0" y="290.0" class="f-muted" fill="#5E6E72" font-size="11.5" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">Dashed: a borrowed model, not this project&#x27;s. Fusion is optional: rag.py defaults to dense when its index exists,</text>
<text x="20.0" y="307.0" class="f-muted" fill="#5E6E72" font-size="11.5" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">else BM25. Each reader is a fine-tuned AnuLM; the pointer reads only text that is in the passages.</text>
