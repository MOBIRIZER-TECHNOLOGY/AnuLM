<title id="t">Figure 19.1 · Latent attention, one layer</title>
<desc id="d">x is projected to queries, split into a non-rotary and a rotary part. A second projection makes a 48-wide latent and a 24-wide rotary key; these two are cached. kv_b_proj expands the latent into every head&#x27;s key part and value; the rotary key is shared across heads; attention and o_proj follow.</desc>
