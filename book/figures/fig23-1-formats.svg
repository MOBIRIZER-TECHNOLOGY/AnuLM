<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="t d" class="figure-svg">
<title id="t">Figure 23.1 · fp32, bf16 and fp16</title>
<desc id="d">float32 has 1 sign, 8 exponent and 23 mantissa bits. bfloat16 keeps the 8 exponent bits and 7 mantissa bits, so the same range with eps 0.0078. float16 has 5 exponent and 10 mantissa bits: finer steps but a maximum of 65,504 and a smallest normal number of 6.1e-05.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#DCE1DF" class="f-rule" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E6E72" class="f-muted-fill"/></marker></defs>
<text x="20.0" y="28.0" class="f-ink" fill="#17262E" font-size="15" font-family="Lora, Georgia, serif" font-weight="700" text-anchor="start">Three ways to store a number</text>
<text x="20.0" y="48.0" class="f-muted" fill="#5E6E72" font-size="12" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-weight="400" text-anchor="start">sign · exponent (range) · mantissa (precision) · values from torch.finfo · verified</text>
