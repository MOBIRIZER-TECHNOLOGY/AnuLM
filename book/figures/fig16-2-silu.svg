<title id="t">Figure 16.2 · SiLU, the gate function</title>
<desc id="d">SiLU is close to zero for very negative g, dips to a minimum of −0.2785 at g = −1.2785, crosses zero at g = 0 and approaches the line y = g for large g.</desc>
