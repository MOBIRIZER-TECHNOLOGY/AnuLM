<text x="16.0" y="288.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">Figure 8.3  Saving a checkpoint so that a crash can&#x27;t destroy the one you already have.</text>
