<polygon points="230.0,230.0 233.0,236.3 227.0,236.3" fill="#8A8F98"/>
<line x1="230.0" y1="186.0" x2="230.0" y2="166.0" stroke="#8A8F98" stroke-width="1.6"/>
<polygon points="230.0,166.0 233.0,172.3 227.0,172.3" fill="#8A8F98"/>
<line x1="230.0" y1="100.0" x2="230.0" y2="80.0" stroke="#8A8F98" stroke-width="1.6"/>
<polygon points="230.0,80.0 233.0,86.3 227.0,86.3" fill="#8A8F98"/>
<text x="470.0" y="60.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1F2433" text-anchor="start">Sizes in the lab</text>
<text x="470.0" y="84.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">875,520 parameters</text>
<text x="470.0" y="104.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">128 numbers per byte (d)</text>
<text x="470.0" y="124.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">4 layers, 4 heads</text>
<text x="470.0" y="144.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">sees 128 bytes at a time</text>
<text x="470.0" y="164.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start"></text>
<text x="470.0" y="184.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">Attention is causal:</text>
<text x="470.0" y="204.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">position t sees bytes 0..t only,</text>
<text x="470.0" y="224.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">so it cannot cheat by reading</text>
<text x="470.0" y="244.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">the answer.</text>
<text x="16.0" y="449.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">Figure 1.3  The whole tiny transformer. Chapter 4 opens each block; here it is enough that each layer adds what</text>
<text x="16.0" y="464.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">it finds to a running representation.</text>
</svg>
