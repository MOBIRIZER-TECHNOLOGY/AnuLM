<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" width="720" height="476" role="img">
<rect width="720" height="476" fill="#FBF8F3"/>
<rect x="100.0" y="380.0" width="260.0" height="44.0" rx="8" fill="#D3EEE9" stroke="#1F9E89" stroke-width="1.5"/>
<text x="230.0" y="400.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1F2433" text-anchor="middle">bytes in</text>
<text x="230.0" y="416.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8A8F98" text-anchor="middle">one number 0-255 per byte</text>
<rect x="100.0" y="318.0" width="260.0" height="44.0" rx="8" fill="#DDE1F7" stroke="#3B4CCA" stroke-width="1.5"/>
<text x="230.0" y="338.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1F2433" text-anchor="middle">embedding + position</text>
<text x="230.0" y="354.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8A8F98" text-anchor="middle">each byte becomes 128 numbers</text>
<rect x="100.0" y="238.0" width="260.0" height="44.0" rx="8" fill="#DDE1F7" stroke="#3B4CCA" stroke-width="1.5"/>
<text x="230.0" y="258.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1F2433" text-anchor="middle">attention</text>
<text x="230.0" y="274.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8A8F98" text-anchor="middle">look back at earlier bytes</text>
<rect x="100.0" y="186.0" width="260.0" height="44.0" rx="8" fill="#DDE1F7" stroke="#3B4CCA" stroke-width="1.5"/>
<text x="230.0" y="206.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1F2433" text-anchor="middle">MLP</text>
<text x="230.0" y="222.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8A8F98" text-anchor="middle">think about what it found</text>
<rect x="100.0" y="100.0" width="260.0" height="44.0" rx="8" fill="#DDE1F7" stroke="#3B4CCA" stroke-width="1.5"/>
<text x="230.0" y="120.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1F2433" text-anchor="middle">output head</text>
<text x="230.0" y="136.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8A8F98" text-anchor="middle">a score for every next byte</text>
<rect x="100.0" y="36.0" width="260.0" height="44.0" rx="8" fill="#FBE3D0" stroke="#E8833A" stroke-width="1.5"/>
<text x="230.0" y="56.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1F2433" text-anchor="middle">probabilities out</text>
<text x="230.0" y="72.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8A8F98" text-anchor="middle">softmax of the scores</text>
<rect x="82.0" y="170.0" width="296.0" height="124.0" rx="12" fill="none" stroke="#3B4CCA" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="390.0" y="236.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3B4CCA" text-anchor="start">× 4 layers</text>
