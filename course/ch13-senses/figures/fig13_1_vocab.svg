<text x="40.0" y="230.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">New rows start at the mean of the trained rows, plus a little noise: a fresh random row would</text>
<text x="40.0" y="248.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">start far from where the trained ones live. Grow both tables, or the model can read the new ids but never write them.</text>
<text x="16.0" y="268.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">Figure 13.1  Two new ids for pictures. Every old id keeps its row, so on text the model is exactly what it was.</text>
