<text x="16.0" y="170.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">A word&#x27;s embedding has norm 0.29. Loss per byte of caption on 200 pictures neither model saw;</text>
<text x="16.0" y="188.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#1F2433" text-anchor="start">&quot;wrong picture&quot; gives each caption another test picture. Lower is better.</text>
