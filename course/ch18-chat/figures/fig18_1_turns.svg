<rect x="381.0" y="50.0" width="232.0" height="36.0" rx="4" fill="#ECE7DF" stroke="#8A8F98" stroke-width="1"/>
<text x="497.0" y="73.0" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600" fill="#1F2433" text-anchor="middle">User: and plus 17?\nAssistant:</text>
