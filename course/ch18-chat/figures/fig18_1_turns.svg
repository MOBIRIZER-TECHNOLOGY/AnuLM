<text x="16.0" y="184.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#D1495B" text-anchor="start">In a real chat each reply is the last one when it is written: grade them all.</text>
<text x="16.0" y="218.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8A8F98" text-anchor="start" font-style="italic">Figure 18.1  Chapter 9&#x27;s mask, over several turns.</text>
