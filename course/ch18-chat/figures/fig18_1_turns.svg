<text x="16.0" y="36.0" font-family="Inter, 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8A8F98" text-anchor="start">one conversation, one row: the model reads all of it</text>
